name: Sync MaliSX2 releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_malisx2.py
      - .github/workflows/sync-malisx2.yml

permissions:
  contents: write

concurrency:
  group: sync-malisx2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync catalog with bmdhacks/malisx2 releases
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_malisx2.py

      - name: Commit and push if the catalog changed
        # Also runs when one release failed its checks but another was added.
        if: ${{ !cancelled() && steps.sync.outputs.added != '' }}
        env:
          ADDED: ${{ steps.sync.outputs.added }}
        run: |
          if git diff --quiet -- drivers.json README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers.json README.md
          git commit -m "Add MaliSX2 ${ADDED} to the driver catalog" -m "Synced automatically from https://github.com/bmdhacks/malisx2/releases"
          git pull --rebase origin main
          git push origin HEAD:main
